[package]
name = "zogzog"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
eframe = "0.34.3"
egui_extras = { version = "0.34.3", features = ["image", "file"] }
env_logger = "0.11.10"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.52.3", features = ["full"] }

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["now"] }
